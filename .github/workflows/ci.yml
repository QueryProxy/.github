# Workflow name must stay "CI": the README badge and branch protection depend on it.
# Actions are pinned to commit SHAs rather than mutable tags. Dependabot
# (github-actions ecosystem) keeps the SHAs current; when bumping one,
# re-resolve the SHA — never edit the version comment alone.
# Tool versions (markdownlint-cli2, lychee) are pinned too; Dependabot does not
# track them, so bump them by hand.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Lint
        run: |
          npx --yes markdownlint-cli2@0.23.3 "**/*.md" "#node_modules"

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install lychee
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: lychee@0.24.2
      - name: Test
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          lychee --no-progress './**/*.md'
