name: Bug report
description: Report something that is broken or misbehaving.
title: "[bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report.

        Before submitting, please:
        - Search [open and closed issues](../issues?q=is%3Aissue) to avoid duplicates.
        - Check the [documentation](https://queryproxy.com/docs/) in case the behavior is intentional.

        **If this is a security problem — a guard bypass, an authorization hole, a masking leak or a credential appearing where it should not — stop here** and follow [SECURITY.md](https://github.com/QueryProxy/.github/blob/main/SECURITY.md) instead. Do not describe it in a public issue.

        **Redact everything sensitive** before pasting: connection credentials, signing secrets, hostnames you would rather not publish, and the literal values in your SQL.

  - type: input
    id: version
    attributes:
      label: QueryProxy version
      description: The release tag, or the image tag you are running.
      placeholder: "v0.1.3"
    validations:
      required: true

  - type: dropdown
    id: deployment
    attributes:
      label: Deployment method
      options:
        - Docker image (docker run)
        - Docker Compose
        - Manual install (PHP 8.3+ server)
        - Local development (php artisan serve)
        - Other (specify in "Additional context")
    validations:
      required: true

  - type: dropdown
    id: app_database
    attributes:
      label: Application database
      description: The database QueryProxy itself stores its data in.
      options:
        - SQLite (default)
        - PostgreSQL
        - MySQL / MariaDB
        - Other (specify in "Additional context")
    validations:
      required: true

  - type: dropdown
    id: target_database
    attributes:
      label: Target database engine (if the bug involves a query)
      options:
        - PostgreSQL
        - MySQL
        - MariaDB
        - SQL Server
        - SQLite
        - Not relevant to this bug
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Query Studio / SQL editor
        - SQL guards (WHERE check, LIMIT clamp, blocked statements)
        - Approval workflow
        - Slack integration
        - Microsoft Teams integration
        - Async execution / queue worker
        - Data masking
        - Result viewer / CSV export
        - Audit log / auditor UI
        - Connections and credentials
        - RBAC, teams and permissions
        - Installation, Docker image, configuration
        - Other (explain below)
    validations:
      required: true

  - type: dropdown
    id: role
    attributes:
      label: Role you were acting as
      options:
        - Admin
        - DBA
        - Developer
        - Auditor
        - Not logged in
        - Not relevant
    validations:
      required: false

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead? Include error messages and relevant log output (redact secrets).
      render: shell
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Minimal steps to reproduce the issue, starting from a fresh instance where possible.
      placeholder: |
        1. Log in as a DBA and create a PostgreSQL connection
        2. Grant it to a developer account
        3. As the developer, submit `SELECT ...`
        4. Approve from Slack
        5. Observe ...
    validations:
      required: true

  - type: textarea
    id: sql
    attributes:
      label: SQL involved (redacted)
      description: |
        The statement that triggered the bug, with literal values replaced
        (`WHERE email = 'REDACTED'`). The structure is what matters; the data is not.
      render: sql
    validations:
      required: false

  - type: textarea
    id: config
    attributes:
      label: Relevant configuration
      description: |
        Environment variables or config values relevant to the bug — masking rules,
        `QUERYPROXY_*` settings, queue setup. **Never paste credentials, `APP_KEY`
        or signing secrets.**
      render: shell
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Screenshots, worker logs, browser console output, anything else relevant.
    validations:
      required: false

  - type: checkboxes
    id: terms
    attributes:
      label: Acknowledgments
      options:
        - label: I have searched existing issues to avoid duplicates.
          required: true
        - label: I have redacted credentials, secrets and real data from everything pasted above.
          required: true
        - label: This is not a security vulnerability (those go to SECURITY.md, privately).
          required: true
